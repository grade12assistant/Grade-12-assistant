<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | کۆنترۆڵی سەرۆک</title>
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.9);
      --primary: #38bdf8;
      --gold: #fbbf24;
      --border: rgba(56, 189, 248, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.15);
    }
    h2 { font-size: 20px; color: var(--primary); text-align: center; margin-bottom: 20px; }
    .input-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(10, 16, 30, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }
    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    #adminContent { display: none; }
  </style>
</head>
<body>

  <!-- دەروازەی پاسۆردی سەرۆک -->
  <div class="panel-card" id="loginBox">
    <h2>🔐 چوونە ژوورەوەی ئەدمین</h2>
    <div class="input-group">
      <label>وشەی نهێنی (PIN):</label>
      <input type="password" id="adminPass" placeholder="پاسۆرد بنووسە...">
    </div>
    <button class="btn" onclick="checkAuth()">چوونە ژوورەوە 🚀</button>
  </div>

  <!-- فۆرمی بارکردنی فایل و بەڕێوەبردن -->
  <div class="panel-card" id="adminContent">
    <h2>⚡ کۆنترۆڵ و بارکردنی وانەکان</h2>
    
    <div class="input-group">
      <label>بەش هەڵبژێرە:</label>
      <select id="subjSelect">
        <option value="bio">🧬 زیندەوەرزانی (ئەحیا)</option>
        <option value="math">📐 بیرکاری</option>
        <option value="phys">⚡ فیزیا</option>
        <option value="chem">🧪 کیمیا</option>
        <option value="eng">👑 English with ego</option>
      </select>
    </div>

    <div class="input-group">
      <label>ناوی فایل یان وانەکە:</label>
      <input type="text" id="itemTitle" placeholder="بۆ نموونە: مەلزەمەی بەندی ١ م. هۆشیار">
    </div>

    <div class="input-group">
      <label>فایلی PDF یان ڤیدیۆ لە مۆبایلەکەتەوە هەڵبژێرە:</label>
      <input type="file" id="fileInput" accept=".pdf,video/*">
    </div>

    <button class="btn" onclick="uploadData()">📤 بارکردن و بڵاوکردنەوە</button>
  </div>

  <script>
    const SECRET_PIN = "7788"; // پاسۆردی تایبەتی خۆت لێرە دەگۆڕیت

    function checkAuth() {
      const pass = document.getElementById('adminPass').value;
      if (pass === SECRET_PIN) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';
      } else {
        alert("پاسۆرد هەڵەیە!");
      }
    }

    function uploadData() {
      const title = document.getElementById('itemTitle').value;
      const file = document.getElementById('fileInput').files[0];

      if (!title || !file) {
        alert("تکایە ناو و فایلی پێویست دیاری بکە!");
        return;
      }

      alert("فایلی «" + title + "» ئامادەیە بۆ ناردن بۆ سێرڤەری کلاود!");
    }
  </script>
</body>
</html>
