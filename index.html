<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 12 Assistant | یاریدەدەری پۆلی ۱۲</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b19;
            --card-surface: rgba(15, 23, 42, 0.75);
            --card-border: rgba(99, 102, 241, 0.2);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #3b82f6 50%, #06b6d4 100%);
            --accent-glow: rgba(99, 102, 241, 0.35);
            --text-pure: #ffffff;
            --text-sub: #94a3b8;
            --badge-bg: rgba(6, 182, 212, 0.15);
            --badge-border: rgba(6, 182, 212, 0.3);
            --badge-color: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-pure);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(147, 51, 234, 0.08) 0%, transparent 60%);
            background-attachment: fixed;
        }

        header {
            padding: 28px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(7, 11, 25, 0.8);
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--accent-glow);
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
            100% { filter: drop-shadow(0 0 22px rgba(6, 182, 212, 0.6)); }
        }

        .header-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 6px;
            font-weight: 400;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px;
            flex-grow: 1;
            width: 100%;
        }

        /* Subjects Slider / Grid */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 12px;
            margin-bottom: 26px;
        }

        .subject-btn {
            background: var(--card-surface);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px 12px;
            color: var(--text-pure);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .subject-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .subject-btn:hover::before {
            left: 100%;
        }

        .subject-btn:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
        }

        .subject-btn.active {
            background: var(--primary-gradient);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45);
            transform: translateY(-3px) scale(1.02);
        }

        /* Category Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 14px;
            margin-bottom: 24px;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar { display: none; }

        .filter-tab {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 9px 20px;
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s ease;
        }

        .filter-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .filter-tab.active {
            background: var(--text-pure);
            color: #070b19;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
        }

        /* Items Grid & Cards */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--card-surface);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
            position: relative;
        }

        .item-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.25);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .thumb-container {
            position: relative;
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: #111a2e;
        }

        .item-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .item-card:hover .item-thumb {
            transform: scale(1.06);
        }

        .item-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--badge-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            backdrop-filter: blur(8px);
        }

        .item-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-pure);
            line-height: 1.4;
        }

        .item-desc {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-bottom: 18px;
            flex-grow: 1;
            line-height: 1.5;
        }

        .open-btn {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .open-btn:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        .open-btn:active {
            transform: scale(0.98);
        }

        /* Modal Viewer */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(4, 7, 16, 0.94);
            z-index: 100;
            flex-direction: column;
            padding: 16px;
            backdrop-filter: blur(16px);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px 16px;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.8);
        }

        .modal-body {
            flex-grow: 1;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .modal-body iframe, .modal-body video {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Admin Footer Trigger */
        .admin-trigger {
            text-align: center;
            padding: 24px 20px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.85rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .admin-trigger:hover {
            color: var(--badge-color);
        }

        /* Admin Box */
        .admin-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 150;
            justify-content: center;
            align-items: center;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .admin-box {
            background: #0e172a;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .admin-input, .admin-select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            margin-bottom: 14px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .admin-input:focus, .admin-select:focus {
            border-color: #6366f1;
        }

        .admin-submit {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">Grade 12 Assistant</div>
        <p class="header-desc">ماڵپەڕی فەرمی یاریدەدەری پۆلی ١٢ بۆ مەلزەمە، ڤیدیۆ و کورتکراوەکان</p>
    </header>

    <div class="container">
        <!-- وانەکان -->
        <div class="subjects-grid">
            <button class="subject-btn active" onclick="setSubject('ahya', this)">زیندەوەرزانی</button>
            <button class="subject-btn" onclick="setSubject('chem', this)">کیمیا</button>
            <button class="subject-btn" onclick="setSubject('phy', this)">فیزیا</button>
            <button class="subject-btn" onclick="setSubject('math', this)">بیرکاری</button>
            <button class="subject-btn" onclick="setSubject('kurd', this)">کوردی</button>
            <button class="subject-btn" onclick="setSubject('ar', this)">عەرەبی</button>
            <button class="subject-btn" onclick="setSubject('eng', this)">ئینگلیزی</button>
        </div>

        <!-- بەشەکانی پۆلێنکردن -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="setCategory('all', this)">✨ هەموو بابەتەکان</button>
            <button class="filter-tab" onclick="setCategory('malzama', this)">📚 مەلزەمەی مامۆستایان</button>
            <button class="filter-tab" onclick="setCategory('video', this)">🎥 ڤیدیۆ و شیکار</button>
            <button class="filter-tab" onclick="setCategory('summary', this)">⚡ کورتکراوەکان</button>
            <button class="filter-tab" onclick="setCategory('exam', this)">📝 پرسیاری وزاری</button>
        </div>

        <!-- لیستی بابەتەکان -->
        <div class="items-grid" id="itemsList"></div>
    </div>

    <!-- Viewer پەنجەرەی ناوخۆیی بۆ بینین -->
    <div class="modal" id="viewerModal">
        <div class="modal-header">
            <h3 id="modalTitle" style="font-size: 1.1rem; color: #fff;"></h3>
            <button class="modal-close" onclick="closeViewer()">✕</button>
        </div>
        <div class="modal-body" id="viewerContent"></div>
    </div>

    <!-- دوگمەی ئەدمین -->
    <div class="admin-trigger" onclick="openAdminLogin()">🔒 پنێڵی تایبەتی ئەدمین</div>

    <!-- پەنجەرەی فۆڕمی ئەدمین -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 1.2rem; color: #fff;">➕ بڵاوکردنەوەی بابەتی نوێ</h3>
                <button onclick="closeAdmin()" style="background:none; border:none; color:#94a3b8; font-size:1.4rem; cursor:pointer;">✕</button>
            </div>
            
            <select class="admin-select" id="newItemSubject">
                <option value="ahya">زیندەوەرزانی (ئەحیا)</option>
                <option value="chem">کیمیا</option>
                <option value="phy">فیزیا</option>
                <option value="math">بیرکاری</option>
                <option value="kurd">کوردی</option>
                <option value="ar">عەرەبی</option>
                <option value="eng">ئینگلیزی</option>
            </select>

            <select class="admin-select" id="newItemCat">
                <option value="malzama">📚 مەلزەمەی مامۆستا (PDF)</option>
                <option value="video">🎥 ڤیدیۆ و شیکار</option>
                <option value="summary">⚡ کورتکراوە و ڕیزبەندی</option>
                <option value="exam">📝 پرسیاری وزاری</option>
            </select>

            <input type="text" class="admin-input" id="newItemTitle" placeholder="ناونیشان (وەک: مەلزەمەی مامۆستا هوشیار وەرزی یەکەم)">
            <input type="text" class="admin-input" id="newItemDesc" placeholder="ڕوونکردنەوەی کورت دەربارەی فایلەکە...">
            <input type="text" class="admin-input" id="newItemThumb" placeholder="لینکی وێنەی بەرگ (ئارەزوومەندانە)">
            <input type="text" class="admin-input" id="newItemUrl" placeholder="لینکی PDF یان فیدیۆی YouTube">

            <button class="admin-submit" onclick="saveNewItem()">🚀 بڵاوکردنەوەی ڕاستەوخۆ</button>
        </div>
    </div>

    <script>
        const ADMIN_PASS = 'omerjamal01@Om2007er@';
        let currentSubject = 'ahya';
        let currentCategory = 'all';

        // داتای سەرەتایی نموونەیی
        let defaultData = {
            'ahya': [
                {
                    id: 1,
                    cat: 'malzama',
                    title: 'مەلزەمەی مامۆستا هوشیار - وەرزی یەکەم',
                    desc: 'تەواوی بەندەکانی وەرزی یەکەم بە ڕوونکردنەوەی وێنەیی و نموونەی گرنگ.',
                    thumb: 'https://images.unsplash.com/photo-1532094349884-543bc11b234d?w=600&q=80',
                    url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                    type: 'pdf'
                },
                {
                    id: 2,
                    cat: 'malzama',
                    title: 'مەلزەمەی مامۆستا حسێن - وەرزی یەکەم و دووەم',
                    desc: 'کۆکراوەی سەرجەم تێبینی و خاڵە گرنگەکان بۆ نمرەی باڵا.',
                    thumb: 'https://images.unsplash.com/photo-1576086213369-97a306d36557?w=600&q=80',
                    url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                    type: 'pdf'
                }
            ]
        };

        let appData = JSON.parse(localStorage.getItem('g12_data_v2')) || defaultData;

        function renderItems() {
            const list = document.getElementById('itemsList');
            list.innerHTML = '';
            
            const subjectItems = appData[currentSubject] || [];
            const filtered = currentCategory === 'all' ? subjectItems : subjectItems.filter(i => i.cat === currentCategory);

            if (filtered.length === 0) {
                list.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 50px 20px; color: var(--text-sub); font-size: 1rem;">هیچ بابەتێک لەم بەشەدا بەردەست نییە.</div>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="thumb-container">
                        <img src="${item.thumb || 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=600&q=80'}" class="item-thumb" alt="${item.title}">
                        <span class="item-badge">${getCatName(item.cat)}</span>
                    </div>
                    <div class="item-content">
                        <div class="item-title">${item.title}</div>
                        <div class="item-desc">${item.desc || ''}</div>
                        <button class="open-btn" onclick="openViewer('${encodeURIComponent(item.title)}', '${encodeURIComponent(item.url)}', '${item.type}')">
                            ${item.type === 'video' ? '▶ سەیرکردنی ڤیدیۆ' : '📖 خوێندنەوەی مەلزەمە'}
                        </button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function getCatName(cat) {
            const map = { malzama: 'مەلزەمە', video: 'ڤیدیۆ', summary: 'کورتکراوە', exam: 'وزاری' };
            return map[cat] || 'بابەت';
        }

        function setSubject(sub, el) {
            currentSubject = sub;
            document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        function setCategory(cat, el) {
            currentCategory = cat;
            document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderItems();
        }

        function openViewer(title, url, type) {
            title = decodeURIComponent(title);
            url = decodeURIComponent(url);
            document.getElementById('modalTitle').textContent = title;
            const container = document.getElementById('viewerContent');
            container.innerHTML = '';

            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop();
                container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allowfullscreen allow="autoplay"></iframe>`;
            } else {
                container.innerHTML = `<iframe src="https://docs.google.com/viewer?url=${encodeURIComponent(url)}&embedded=true"></iframe>`;
            }

            document.getElementById('viewerModal').style.display = 'flex';
        }

        function closeViewer() {
            document.getElementById('viewerContent').innerHTML = '';
            document.getElementById('viewerModal').style.display = 'none';
        }

        function openAdminLogin() {
            const entered = prompt('تکایە پاسۆردی بەڕێوەبەر بنووسە:');
            if (entered === ADMIN_PASS) {
                document.getElementById('adminModal').style.display = 'flex';
            } else if (entered !== null) {
                alert('پاسۆردەکە هەڵەیە!');
            }
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function saveNewItem() {
            const subject = document.getElementById('newItemSubject').value;
            const cat = document.getElementById('newItemCat').value;
            const title = document.getElementById('newItemTitle').value.trim();
            const desc = document.getElementById('newItemDesc').value.trim();
            const thumb = document.getElementById('newItemThumb').value.trim();
            const url = document.getElementById('newItemUrl').value.trim();

            if (!title || !url) {
                alert('تکایە ناونیشان و بەستەری فایلەکە بنووسە!');
                return;
            }

            const isVideo = cat === 'video' || url.includes('youtube') || url.includes('youtu.be');

            const newItem = {
                id: Date.now(),
                cat: cat,
                title: title,
                desc: desc,
                thumb: thumb,
                url: url,
                type: isVideo ? 'video' : 'pdf'
            };

            if (!appData[subject]) appData[subject] = [];
            appData[subject].unshift(newItem);

            localStorage.setItem('g12_data_v2', JSON.stringify(appData));

            alert('بابەتەکە بە سەرکەوتوویی زیادکرا!');
            closeAdmin();
            renderItems();
        }

        renderItems();
    </script>
</body>
</html>
